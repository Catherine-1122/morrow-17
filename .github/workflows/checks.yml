name: Atlas checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  verify:
    name: Venice sample · Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked development tools
        run: npm ci
      - name: Test search, saves and server boundaries
        run: npm test
      - name: Verify illustration provenance
        run: npm run artwork:check
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Test the saved guide in a browser
        run: npm run test:browser
